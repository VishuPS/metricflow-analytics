name: Deploy Worker API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "workers/**"
      - "wrangler.worker.toml"
      - ".github/workflows/deploy-worker-api.yml"

concurrency:
  group: deploy-worker-api-main
  cancel-in-progress: true

jobs:
  deploy-worker:
    name: Deploy metricflow-api Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)

      - name: Deploy Worker API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.93.1 deploy --config wrangler.worker.toml
