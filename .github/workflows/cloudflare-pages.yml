name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript
        run: npm run check

      - name: Configure Worker OAuth secrets
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REDIRECT_URI: ${{ secrets.LINKEDIN_REDIRECT_URI }}
        run: |
          if [ -n "$LINKEDIN_CLIENT_ID" ]; then
            printf "%s" "$LINKEDIN_CLIENT_ID" | npx wrangler@4.93.1 secret put LINKEDIN_CLIENT_ID --config wrangler.worker.toml
          fi
          if [ -n "$LINKEDIN_CLIENT_SECRET" ]; then
            printf "%s" "$LINKEDIN_CLIENT_SECRET" | npx wrangler@4.93.1 secret put LINKEDIN_CLIENT_SECRET --config wrangler.worker.toml
          fi
          if [ -n "$LINKEDIN_REDIRECT_URI" ]; then
            printf "%s" "$LINKEDIN_REDIRECT_URI" | npx wrangler@4.93.1 secret put LINKEDIN_REDIRECT_URI --config wrangler.worker.toml
          fi

      - name: Configure Worker email secrets
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            printf "%s" "$RESEND_API_KEY" | npx wrangler@4.93.1 secret put RESEND_API_KEY --config wrangler.worker.toml
          fi
          if [ -n "$EMAIL_FROM" ]; then
            printf "%s" "$EMAIL_FROM" | npx wrangler@4.93.1 secret put EMAIL_FROM --config wrangler.worker.toml
          fi
          if [ -n "$EMAIL_REPLY_TO" ]; then
            printf "%s" "$EMAIL_REPLY_TO" | npx wrangler@4.93.1 secret put EMAIL_REPLY_TO --config wrangler.worker.toml
          fi

      - name: Deploy Worker API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.93.1 deploy --config wrangler.worker.toml

      - name: Build static assets
        run: npm run build:cloudflare

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.93.1 pages deploy dist --project-name metricflow-analytics --branch main
