name: Cleanup USER_STATE once

on:
  push:
    branches:
      - main

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all USER_STATE KV keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          USER_STATE_NAMESPACE_ID: 7bc55f01f01d49a28774f63eb0ed183e
        run: |
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const namespaceId = process.env.USER_STATE_NAMESPACE_ID;
          if (!token || !accountId || !namespaceId) {
            throw new Error("Missing Cloudflare cleanup configuration");
          }

          const base = `https://api.cloudflare.com/client/v4/accounts/${accountId}/storage/kv/namespaces/${namespaceId}`;
          const headers = { authorization: `Bearer ${token}`, "content-type": "application/json" };
          let cursor = "";
          let deleted = 0;

          async function cloudflare(path, options = {}) {
            const response = await fetch(`${base}${path}`, { ...options, headers: { ...headers, ...(options.headers || {}) } });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.success === false) {
              throw new Error(JSON.stringify(payload));
            }
            return payload;
          }

          do {
            const query = new URLSearchParams({ limit: "1000" });
            if (cursor) query.set("cursor", cursor);
            const payload = await cloudflare(`/keys?${query}`);
            for (const key of payload.result || []) {
              await cloudflare(`/values/${encodeURIComponent(key.name)}`, { method: "DELETE" });
              deleted += 1;
            }
            cursor = payload.result_info?.cursor || "";
          } while (cursor);

          console.log(`Deleted ${deleted} USER_STATE KV keys.`);
          NODE
