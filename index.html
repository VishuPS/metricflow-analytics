    <title>Metrillix Analytics</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Metrillix",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://metrillix.com/",
        "description": "Metrillix helps teams turn LinkedIn Company Page analytics into reports, recommendations, and content planning decisions.",
        "offers": [
          { "@type": "Offer", "name": "Growth", "price": "9.99", "priceCurrency": "USD", "url": "https://metrillix.com/pricing" },
          { "@type": "Offer", "name": "Enterprise", "url": "https://metrillix.com/pricing" }
        ]
      }
    </script>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("metrillix.theme");
          const system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = saved || system;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="/styles.css?v=20260808-seo-stripe-plans">
  </head>
  <body>
    <noscript>

        <h2>Plans</h2>
        <ul>
          <li>Starter: one LinkedIn Company Page for basic performance review.</li>
          <li>Growth: deeper LinkedIn reporting, planning, and priority intelligence features.</li>
          <li>Enterprise: manage up to five LinkedIn Company Pages with cross-page reporting and priority support.</li>
        </ul>
        <p><a href="/pricing">View pricing</a> or <a href="/contact">contact Metrillix</a>.</p>
      </main>
    </noscript>
    <div id="app"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
