<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Metrillix Analytics</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("metrillix.theme");
          const system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = saved || system;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?v=20260612-data-space-theme">
  </head>
  <body>
    <div id="app"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="/config.js?v=20260526-publish-copy"></script>
    <script src="/app.js?v=20260611-ai-strategy"></script>
  </body>
</html>
